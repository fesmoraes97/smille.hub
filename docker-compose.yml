version: "3.7"

services:
  smille-hub:
    image: smille-hub:latest
    build: .
    networks:
      - PENDENTE_REDE_DOCKER
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.smille-hub.rule=Host(`PENDENTE_DOMINIO`)
        - traefik.http.routers.smille-hub.entrypoints=websecure
        - traefik.http.routers.smille-hub.tls.certresolver=letsencryptresolver
        - traefik.http.routers.smille-hub.service=smille-hub
        - traefik.http.services.smille-hub.loadbalancer.server.port=80
        - traefik.http.services.smille-hub.loadbalancer.passHostHeader=true

networks:
  PENDENTE_REDE_DOCKER:
    name: PENDENTE_REDE_DOCKER
    external: true
